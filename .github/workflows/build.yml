name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      # डायग्नॉस्टिक: फ़ोल्डर स्ट्रक्चर दिखाएगा
      - name: Show directory structure
        run: |
          echo "=== ROOT FILES ==="
          ls -la
          echo "=== SEARCHING FOR settings.gradle.kts ==="
          find . -name settings.gradle.kts
          echo "=== SEARCHING FOR app/build.gradle.kts ==="
          find . -path "*/app/build.gradle.kts"

      # Vosk मॉडल डाउनलोड करें (सुनिश्चित करें कि app फ़ोल्डर रूट में है)
      - name: Download Vosk model
        run: |
          if [ ! -d app/src/main/assets/models ]; then
            mkdir -p app/src/main/assets/models
          fi
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model-small-en-us-0.15.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/models/
          rm vosk-model-small-en-us-0.15.zip

      # बिल्ड करें – सीधे gradle कमांड से, बिना wrapper के
      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
