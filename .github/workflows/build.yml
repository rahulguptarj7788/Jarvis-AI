name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          cmdline_tools_url="https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          wget -q $cmdline_tools_url -O commandlinetools.zip
          unzip -q commandlinetools.zip -d $HOME/android-sdk
          yes | $HOME/android-sdk/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/android-sdk --install "cmdline-tools;latest" || true
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Download and extract Vosk model into app assets
        run: |
          MODEL_URL="https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip"
          ASSETS_DIR="app/src/main/assets"
          TMP_DIR="/tmp/vosk-extract"
          mkdir -p $ASSETS_DIR
          rm -rf $TMP_DIR && mkdir -p $TMP_DIR
          wget -q $MODEL_URL -O /tmp/vosk-model.zip
          unzip -q /tmp/vosk-model.zip -d $TMP_DIR
          rm -rf $ASSETS_DIR/model
          mv $TMP_DIR/vosk-model-small-en-us-0.15 $ASSETS_DIR/model
          rm -f /tmp/vosk-model.zip
          rm -rf $TMP_DIR
          echo "Model files:"
          find $ASSETS_DIR/model -maxdepth 1

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
