name: Build Debug APK

on:
  workflow_dispatch:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Show directory structure
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== FIND app/build.gradle.kts ==="
          find . -path "*/app/build.gradle.kts"

      # डायग्नोस्टिक: app/build.gradle.kts का कंटेंट दिखाएं
      - name: Print app/build.gradle.kts content
        run: |
          echo "Content of app/build.gradle.kts:"
          cat app/build.gradle.kts

      - name: Download Vosk model
        run: |
          mkdir -p app/src/main/assets/models
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model-small-en-us-0.15.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/models/
          rm vosk-model-small-en-us-0.15.zip

      # डायग्नोस्टिक: उपलब्ध टास्क दिखाएं
      - name: List tasks for :app module
        run: gradle :app:tasks --all

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
