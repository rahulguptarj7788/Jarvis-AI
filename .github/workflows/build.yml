name: Build Debug APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Show full directory structure
        run: |
          echo "===== ROOT DIRECTORY ====="
          ls -la
          echo ""
          echo "===== FULL TREE ====="
          find . -type d | head -30
          echo ""
          echo "===== SEARCH FOR app/build.gradle.kts ====="
          find . -name "build.gradle.kts" -path "*/app/*"

      - name: Download Vosk model
        run: |
          mkdir -p app/src/main/assets/models
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk-model-small-en-us-0.15.zip
          mv vosk-model-small-en-us-0.15 app/src/main/assets/models/
          rm vosk-model-small-en-us-0.15.zip

      - name: Generate Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
